security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10


  discount:
    codes:
      abcdef: 10



#logging:
#  level:
#    org.springframework.data.rest: debug

# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
  mongodb:
    embedded:
      version: 4.0.12
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  application:
    name: taco-cloud
  data:
    mongodb:
      auto-index-creation: true
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Kafka properties.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

tacocloud:
  messaging:
    transport: ${TACOCLOUD_MESSAGING_TRANSPORT:noop}
    jms:
      destination: ${JMS_ORDER_DESTINATION:tacocloud.order.queue}
    rabbit:
      exchange: ${RABBIT_ORDER_EXCHANGE:}
      routing-key: ${RABBIT_ORDER_ROUTING_KEY:tacocloud.order.queue}
    kafka:
      topic: ${KAFKA_ORDER_TOPIC:tacocloud.orders.topic}

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
management:
#end::infoGitModeFull[]
#end::healthShowDetails[]
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
#end::exposeAll[]
        exclude: threaddump,heapdump
#end::excludeSome[]
#tag::healthShowDetails[]
  endpoint:
    health:
      show-details: when-authorized
      roles:
        - ADMIN
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

