name: Taco Cloud tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Critical regressions
        run: mvn -B -f tacocloud/pom.xml -Pcritical-regressions test
      - name: Full suite
        run: mvn -B -f tacocloud/pom.xml verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
