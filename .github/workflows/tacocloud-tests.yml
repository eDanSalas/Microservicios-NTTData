name: Taco Cloud tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker availability
        run: docker info
      - name: Build test runner
        run: docker compose -f compose.tests.yml build tests
      - name: Critical regressions
        run: docker compose -f compose.tests.yml run --rm -e CI=true -e REPORT_SET=critical tests -Pcritical-regressions clean test
      - name: Full suite
        run: docker compose -f compose.tests.yml run --rm -e CI=true tests clean verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: 'test-reports/**'
          if-no-files-found: error
